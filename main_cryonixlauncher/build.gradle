plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cryonix.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'git.neko.cryonix'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        resValue 'string', 'application_package', 'git.neko.cryonix'
        resValue 'string', 'storageProviderAuthorities', 'git.neko.cryonix.scoped.gamefolder'
        resValue 'string', 'shareProviderAuthority', 'git.neko.cryonix.scoped.controlfolder'
        resValue 'string', 'curseforge_api_key', 'DUMMY'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        resValues true
        prefab true
    }

    sourceSets {
        main {
            // Pojav backend files live directly inside the Cryonix application module.
            res.srcDirs += file('src/main/res_pojav')
            assets.srcDirs += file('src/main/assets')
            jni.srcDirs += file('src/main/jni')
            jniLibs.srcDirs += file('src/main/jniLibs')
        }
    }

    def pojavCompatDir = layout.buildDirectory.dir('generated/source/pojavCompat').get().asFile

    def generatePojavCompat = tasks.register('generatePojavCompat') {
        dependsOn 'processDebugResources'
        outputs.dir(pojavCompatDir)
        doLast {
            def generatedR = fileTree(layout.buildDirectory.dir('generated/not_namespaced_r_class_sources/debug/processDebugResources/r').get().asFile).matching {
                include '**/R.java'
            }.files.find { it.path.endsWith('/com/cryonix/launcher/R.java') }
            if (generatedR == null || !generatedR.exists()) {
                throw new GradleException('Cryonix generated R.java was not found')
            }
            def rText = generatedR.getText('UTF-8').replaceFirst('package com\\.cryonix\\.launcher;', 'package net.kdt.pojavlaunch;')
            def rOut = new File(pojavCompatDir, 'net/kdt/pojavlaunch/R.java')
            rOut.parentFile.mkdirs()
            rOut.text = rText

            def bcOut = new File(pojavCompatDir, 'net/kdt/pojavlaunch/BuildConfig.java')
            bcOut.parentFile.mkdirs()
            bcOut.text = '''package net.kdt.pojavlaunch;
public final class BuildConfig {
    public static final boolean DEBUG = com.cryonix.launcher.BuildConfig.DEBUG;
    public static final String APPLICATION_ID = com.cryonix.launcher.BuildConfig.APPLICATION_ID;
    public static final String BUILD_TYPE = com.cryonix.launcher.BuildConfig.BUILD_TYPE;
    public static final String FLAVOR = com.cryonix.launcher.BuildConfig.FLAVOR;
    public static final int VERSION_CODE = com.cryonix.launcher.BuildConfig.VERSION_CODE;
    public static final String VERSION_NAME = com.cryonix.launcher.BuildConfig.VERSION_NAME;
    private BuildConfig() {}
}
'''
        }
    }

    sourceSets.main.java.srcDir(pojavCompatDir)
    ndkVersion = '25.2.9519653'

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'
    implementation 'org.tukaani:xz:1.8'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.9'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
