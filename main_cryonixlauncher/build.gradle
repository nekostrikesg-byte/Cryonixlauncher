plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cryonix.launcher'
    compileSdk 37

    defaultConfig {
        applicationId 'com.cryonix.launcher'
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
}
