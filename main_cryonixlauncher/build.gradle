plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Native ABIs packaged by default. The vendored Pojav/Mojo backend ships
// prebuilt natives for arm64-v8a. Extra ABIs (armeabi-v7a, x86, x86_64) are
// added by initializing the engine/pojav submodule and running the
// syncPojavBackend task, or by passing -PcryonixAbis=...
def defaultAbis = ['arm64-v8a']
if (project.hasProperty('cryonixAbis')) {
    defaultAbis = project.property('cryonixAbis').split(',').collect { it.trim() }
}

android {
    namespace 'com.cryonix.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'git.neko.cryonix'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        resValue 'string', 'application_package', 'git.neko.cryonix'
        resValue 'string', 'storageProviderAuthorities', 'git.neko.cryonix.scoped.gamefolder'
        resValue 'string', 'shareProviderAuthority', 'git.neko.cryonix.scoped.controlfolder'
        resValue 'string', 'curseforge_api_key', 'DUMMY'

        ndk {
            abiFilters(*defaultAbis.toArray(new String[0]))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    buildFeatures {
        buildConfig true
        resValues true
        prefab true
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            assets.srcDirs += file('src/main/assets')
            jni.srcDirs += file('src/main/jni')
            jniLibs.srcDirs += file('src/main/jniLibs')
        }
    }

    ndkVersion = '25.2.9519653'

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }

    packagingOptions {
        jniLibs {
            // The Pojav backend dlopen()s its own libraries, so they must stay
            // as real files inside the nativeLibraryDir.
            useLegacyPackaging = true
        }
        pickFirst '**/libbytehook.so'
        pickFirst '**/libc++_shared.so'
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    lint {
        abortOnError false
    }
}

// Java sources target Java 17; keep the Kotlin JVM target in sync.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// ---------------------------------------------------------------------------
// Vendored Pojav/Mojo backend
//
// The runtime pieces (native libraries, LWJGL3 classes, caciocavallo and
// security components) are vendored under src/main so a plain clone builds a
// working APK. Initializing the engine/pojav submodule additionally provides
// the remaining ABIs; syncPojavBackend copies them in.
// ---------------------------------------------------------------------------
def pojavSubmodule = rootProject.file('engine/pojav')
def backendNativesDir = file('src/main/jniLibs')
def backendComponentsDir = file('src/main/assets/components')

def requiredBackendFiles = [
        'jniLibs/arm64-v8a/liblwjgl.so',
        'jniLibs/arm64-v8a/libgl4es_114.so',
        'jniLibs/arm64-v8a/libopenal.so',
        'jniLibs/arm64-v8a/libunpack200.so',
        'assets/components/lwjgl3/lwjgl-glfw-classes.jar',
        'assets/components/caciocavallo/cacio-shared-1.10-SNAPSHOT.jar',
        'assets/components/security/pro-grade.jar',
        'assets/components/arc_dns_injector/arc_dns_injector.jar',
        'assets/components/forge_installer/forge_installer.jar'
]

tasks.register('verifyPojavBackend') {
    group = 'cryonix'
    description = 'Fails early when a vendored Pojav backend runtime file is missing'
    def missing = requiredBackendFiles.findAll { !file("src/main/$it").exists() }
    doLast {
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "The vendored Pojav backend is incomplete. Missing:\n  - " +
                            missing.join('\n  - ') +
                            "\nRun: git submodule update --init engine/pojav && gradle :main_cryonixlauncher:syncPojavBackend")
        }
    }
}

tasks.register('syncPojavBackend') {
    group = 'cryonix'
    description = 'Copies native libraries and runtime components from the engine/pojav submodule'
    onlyIf { new File(pojavSubmodule, 'app_pojavlauncher').isDirectory }
    doLast {
        def upstreamMain = new File(pojavSubmodule, 'app_pojavlauncher/src/main')
        copy {
            from new File(upstreamMain, 'jniLibs')
            into backendNativesDir
        }
        copy {
            from new File(upstreamMain, 'assets/components')
            into backendComponentsDir
            exclude '**/jre*/**'
        }
        copy {
            from new File(upstreamMain, 'assets')
            into file('src/main/assets')
            include 'default.json', 'options.txt', 'resolv.conf', 'launcher_profiles.json'
        }
        logger.lifecycle("Pojav backend synced from engine/pojav (commit ${project.pojavBackendCommit})")
    }
}

tasks.named('preBuild').configure {
    dependsOn 'verifyPojavBackend'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-beta01'
    implementation 'androidx.annotation:annotation:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'com.github.duanhong169:checkerboarddrawable:1.0.2'
    implementation 'com.github.PojavLauncherTeam:portrait-sdp:ed33e89cbc'
    implementation 'com.github.PojavLauncherTeam:portrait-ssp:6c02fd739b'
    implementation 'com.github.Mathias-Boulay:ExtendedView:1.0.0'
    implementation 'com.github.Mathias-Boulay:android_gamepad_remapper:2.0.3'
    implementation 'com.github.Mathias-Boulay:virtual-joystick-android:1.14'
    implementation 'org.tukaani:xz:1.8'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.6.1'
    implementation 'com.bytedance:bytehook:1.0.9'
    // Vendored backend jars, plus the optional LTW renderer plugin
    // (PojavLauncherTeam/LTW) that CI drops into libs/. The system OpenGL
    // renderer works without LTW.
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
