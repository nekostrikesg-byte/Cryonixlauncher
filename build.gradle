plugins {
    id 'com.android.application' version '9.4.0' apply false
    id 'com.android.library' version '9.4.0' apply false
}

ext.gitUsed = {
    def proc = new ProcessBuilder('git', 'rev-parse', '--is-inside-work-tree')
        .directory(rootDir)
        .redirectErrorStream(true)
        .start()
    proc.waitFor() == 0 && proc.inputStream.text.trim() == 'true'
}

ext.getGitHash = { String projectPath ->
    def proc = new ProcessBuilder('git', 'rev-list', '-1', 'HEAD', projectPath)
        .directory(rootDir)
        .redirectErrorStream(true)
        .start()
    proc.waitFor()
    if (proc.exitValue() != 0) return 'unknown'
    proc.inputStream.text.trim()
}

subprojects {
    ext.gitUsed = { rootProject.ext.gitUsed.call() }
    ext.getGitHash = { String projectPath -> rootProject.ext.getGitHash.call(projectPath) }
}


def preparePojavComponents = tasks.register('preparePojavComponents', Exec) {
    workingDir file('engine/pojav')
    commandLine './gradlew',
        ':jre_lwjgl3glfw:jar',
        ':forge_installer:jar',
        ':arc_dns_injector:jar',
        '--no-daemon'
    doFirst {
        File wrapper = file('engine/pojav/gradlew')
        if (!wrapper.exists()) {
            throw new GradleException(
                'Pojav submodule is not initialized. Run: git submodule update --init --recursive'
            )
        }
        wrapper.setExecutable(true)
    }
}

project(':pojav_runtime').afterEvaluate {
    tasks.matching { it.name == 'preBuild' }.configureEach {
        dependsOn rootProject.tasks.named('preparePojavComponents')
    }
}
