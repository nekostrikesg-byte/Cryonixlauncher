name: Cryonix build

on:
  push:
    branches: [cryonix_v2sdl]
  pull_request:
    branches: [cryonix_v2sdl]

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cryonix with Pojav backend
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Assemble Cryonix debug APK
        run: gradle :main_cryonixlauncher:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cryonix-debug-apk
          path: main_cryonixlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
