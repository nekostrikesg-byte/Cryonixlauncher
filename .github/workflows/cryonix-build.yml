name: Cryonix build

permissions:
  contents: write

on:
  push:
    branches: [cryonix_v2sdl, 'arena/**']
  pull_request:
    branches: [cryonix_v2sdl]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cryonix
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Fetch optional LTW renderer plugin
        continue-on-error: true
        run: |
          wget -q -O main_cryonixlauncher/libs/ltw-release.aar \
            https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar
          ls -la main_cryonixlauncher/libs

      - name: Fetch optional extra backend ABIs from engine/pojav
        continue-on-error: true
        run: |
          git submodule update --init --depth 1 engine/pojav
          if [ -d engine/pojav/app_pojavlauncher/src/main ]; then
            gradle :main_cryonixlauncher:syncPojavBackend --no-daemon
            echo "CRYONIX_EXTRA_ABIS=armeabi-v7a,x86,x86_64" >> "$GITHUB_ENV"
          fi

      - name: Verify backend reference integrity
        run: python3 tools/verify_backend_refs.py

      - name: Assemble Cryonix debug APK
        id: assemble
        continue-on-error: true
        run: |
          gradle :main_cryonixlauncher:assembleDebug --stacktrace --no-daemon \
            ${CRYONIX_EXTRA_ABIS:+-PcryonixAbis=arm64-v8a,$CRYONIX_EXTRA_ABIS} 2>&1 | tee build.log

      - name: Publish build diagnostics
        if: always()
        run: python3 tools/ci-report-build.py

      - name: Fail when the build failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cryonix-debug-apk
          path: main_cryonixlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
