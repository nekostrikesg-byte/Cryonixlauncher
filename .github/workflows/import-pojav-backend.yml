name: Import Pojav backend into Cryonix

on:
  workflow_dispatch:
  push:
    branches: [cryonix_v2sdl]
    paths:
      - .github/workflows/import-pojav-backend.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download pinned Pojav source
        run: |
          git clone --depth 1 https://github.com/PojavLauncherTeam/PojavLauncher.git /tmp/pojav
          cd /tmp/pojav
          git fetch --depth 1 origin b12ad048157b3aa255d078c235dd4571e1900309
          git checkout b12ad048157b3aa255d078c235dd4571e1900309

      - name: Copy Pojav backend files into Cryonix main module
        shell: bash
        run: |
          set -e
          mkdir -p main_cryonixlauncher/src/main/java
          mkdir -p main_cryonixlauncher/src/main/jni
          mkdir -p main_cryonixlauncher/src/main/jniLibs
          mkdir -p main_cryonixlauncher/src/main/assets
          mkdir -p main_cryonixlauncher/libs
          rsync -a /tmp/pojav/app_pojavlauncher/src/main/java/ main_cryonixlauncher/src/main/java/
          rsync -a /tmp/pojav/app_pojavlauncher/src/main/jni/ main_cryonixlauncher/src/main/jni/
          rsync -a /tmp/pojav/app_pojavlauncher/src/main/jniLibs/ main_cryonixlauncher/src/main/jniLibs/
          rsync -a /tmp/pojav/app_pojavlauncher/src/main/assets/ main_cryonixlauncher/src/main/assets/
          rsync -a /tmp/pojav/app_pojavlauncher/libs/ main_cryonixlauncher/libs/
          mkdir -p main_cryonixlauncher/src/main/res_pojav
          rsync -a /tmp/pojav/app_pojavlauncher/src/main/res/ main_cryonixlauncher/src/main/res_pojav/
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path("main_cryonixlauncher/src/main/res")
          pojav=Path("main_cryonixlauncher/src/main/res_pojav")
          for f in list(pojav.rglob("*.xml")):
              rel=f.relative_to(pojav)
              dest=base/rel
              if not dest.exists():
                  continue
              if rel.parts[0].startswith("values"):
                  try:
                      a=ET.parse(dest); ar=a.getroot()
                      b=ET.parse(f); br=b.getroot()
                      for x in br:
                          name=x.attrib.get("name")
                          if name=="app_name":
                              continue
                          if name and any(y.tag==x.tag and y.attrib.get("name")==name for y in ar):
                              continue
                          ar.append(x)
                      a.write(dest,encoding="utf-8",xml_declaration=True)
                  except Exception:
                      f.unlink()
              else:
                  f.unlink()
          PY
          rm -rf engine/pojav pojav_runtime
          rm -f .gitmodules
          git add main_cryonixlauncher engine/pojav pojav_runtime .gitmodules
          if git diff --cached --quiet; then
            echo "Nothing to import"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import Pojav backend files directly into Cryonix main module [skip ci]"
          git push origin HEAD:cryonix_v2sdl
